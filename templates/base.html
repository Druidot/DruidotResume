    <script>


        function applyDataTables() {
            $('table').each(function () {
                // Check if the table is already initialized
                if (!$.fn.DataTable.isDataTable(this)) {
                    $(this).DataTable({
                        paging: true,
                        searching: true,
                        ordering: true,
                        info: true
                    });
                }
            });
        }
        //    $(document).ready(function () {
        //         applyDataTables(); // Call the function to apply DataTables to all tables
        //     });
        function CallAPI(endpoint, method, data, onSuccess = null, onError = null) {
            $.ajax({
                url: endpoint,
                type: method,
                data: JSON.stringify(data),
                contentType: 'application/json',
                dataType: 'json',
                success: function (response) {
                    console.log("Success:", response);
                    if (method == "POST") {

                        Swal.fire({
                            icon: response.icon || "success",
                            title: response.title || "Success",
                            text: response.message || "Operation completed successfully",
                        });
                    }

                    if (onSuccess) onSuccess(response);
                },
                error: function (xhr, status, error) {
                    console.error("Error:", error);
                    if (method == "POST") {
                        Swal.fire({
                            icon: (xhr.responseJSON && xhr.responseJSON.icon) || "error",
                            title: "Error",
                            text: (xhr.responseJSON && xhr.responseJSON.message) || "Something went wrong",
                        });
                    }

                    if (onError) onError(xhr, status, error);
                }
            });
            applyDataTables();

        }


    </script>
