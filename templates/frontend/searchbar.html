{% extends './frontend/base.html' %}
{% block body %}

<style>
    /* Search Box */
    .search-container {
        display: flex;
        justify-content: center;
        margin-bottom: 30px;
        position: relative;
    }

    .search-box {
        width: 100%;
        max-width: 600px;
        padding: 12px;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        outline: none;
        font-size: 16px;
    }

    .search-button {
        margin-left: 10px;
        padding: 12px 20px;
        border: none;
        border-radius: 24px;
        background-color: #000435;
        color: white;
        cursor: pointer;
    }

    .search-button:hover {
        background-color: #FF8C00;
    }

    /* Suggestions Dropdown */
    .suggestions {
        position: absolute;
        top: 100%; /* Align suggestions directly below the input */
        left: 0;
        width: 100%; /* Ensure width matches search box */
        background: #fff;
        border: 1px solid #dfe1e5;
        border-top: none;
        border-radius: 0 0 24px 24px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 999;
        box-sizing: border-box; /* Ensure padding doesn't affect width */
    }

    .suggestion-item {
        padding: 10px 15px;
        cursor: pointer;
    }

    .suggestion-item:hover {
        background: #f1f3f4;
    }

    /* Search Results */
    #results {
        max-width: 100%;
        margin: 0 auto;
    }

    .result-item {
        margin-bottom: 24px;
    }

    .result-title {
        font-size: 18px;
        color: #1a0dab;
        text-decoration: none;
    }

    .result-title:hover {
        text-decoration: underline;
    }

    .result-url {
        color: #4d5156;
        font-size: 14px;
        margin: 4px 0;
    }

    .result-snippet {
        font-size: 14px;
        color: #3c4043;
    }
</style>

<!-- <div class="search-container">
    <input type="text" id="searchInput" class="search-box" placeholder="Search companies...">
    <button class="search-button" onclick="triggerSearch()">Search</button>
</div> -->

<div class="input-group mb-3">
    <input type="text" id="searchInput" class="form-control" placeholder="Search companies..." aria-label="Recipient's username" aria-describedby="basic-addon2">
    <button class="input-group-text" id="basic-addon2" onclick="triggerSearch()">Search</button>
    <div id="suggestions" class="suggestions" style="display: none;"></div>

  </div>
<div id="results" class="my-4"></div>

<script>
    const searchInput = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('suggestions');
    const resultsContainer = document.getElementById('results');

    let companies = [];

    async function fetchCompanyData() {
        try {
            const response = await fetch('/admin/get_records/company');
            companies = await response.json();
        } catch (error) {
            console.error('Error fetching company data:', error);
        }
    }

    function showSuggestions(query) {
        if (!query) {
            suggestionsBox.style.display = 'none';
            resultsContainer.innerHTML = ''; // Clear results when search box is empty
            return;
        }

        const filtered = companies.filter(company =>
            company.company_name.toLowerCase().includes(query.toLowerCase())
        ).slice(0, 5); // Limit to 5 suggestions

        if (filtered.length === 0) {
            suggestionsBox.style.display = 'none';
            return;
        }

        suggestionsBox.innerHTML = filtered.map(company => `
            <div class="suggestion-item" onclick="performSearch('${company.company_name}')">
                ${company.company_name}
            </div>
        `).join('');

        suggestionsBox.style.display = 'block';
    }

    function performSearch(query) {
        searchInput.value = query;
        suggestionsBox.style.display = 'none';
        displayResults(query);
    }

    function triggerSearch() {
        performSearch(searchInput.value);
    }

    function displayResults(query) {
        const filtered = companies.filter(company =>
            company.company_name.toLowerCase().includes(query.toLowerCase())
        );

        if (filtered.length === 0) {
            resultsContainer.innerHTML = '<p>No results found</p>';
            return;
        }

        resultsContainer.innerHTML = filtered.map(company => `
            <div class="result-item">
                <a href="/admin/company/details/${company.company_id}" class="result-title">${company.company_name}</a>
                <div class="result-url">${company.company_name} | ${company.company_address} | ${company.company_email}</div>
                <div class="result-snippet">${company.company_description || 'Learn more about ' + company.company_name}</div>
            </div>
        `).join('');
    }

    searchInput.addEventListener('input', (e) => showSuggestions(e.target.value));

    searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            triggerSearch();
        }
    });

    fetchCompanyData();
</script>

{% endblock body %}
