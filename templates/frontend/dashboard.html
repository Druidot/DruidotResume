<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <!-- Link to Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    /* Default icon color in dark mode */
    .dark-mode .fab, .dark-mode .fas {
      color: white;
    }

    /* Icon color for light mode */
    .light-mode .fab, .light-mode .fas {
      color: black;
    }
    
    /* Dark mode specific button colors */
    .dark-mode .btn-outline-light {
      color: white;
      border-color: white;
    }

    /* Light mode specific button colors */
    .light-mode .btn-outline-light {
      color: black;
      border-color: black;
    }

    .dark-mode .dark-mode-icon {
      color: yellow;
    }
    .light-mode .dark-mode-icon {
      color: black;
    }
  </style>
</head>
<body class="bg-dark text-white dark-mode">
  <!-- Sidebar -->
  <div class="sidebar position-fixed h-100 bg-dark text-white p-3" id="sidebar" style="width: 250px; left: -250px; transition: left 0.3s;">
    <div class="sidebar-item p-3 d-flex align-items-center" onclick="openLink('home')"><i class="fas fa-home me-2"></i> Home</div>
    <div class="sidebar-item p-3 d-flex align-items-center" onclick="openLink('trending')"><i class="fas fa-fire me-2"></i> Trending</div>
    <div class="sidebar-item p-3 d-flex align-items-center" onclick="openLink('subscriptions')"><i class="fas fa-play-circle me-2"></i> Subscriptions</div>
    <div class="sidebar-item p-3 d-flex align-items-center" onclick="openLink('history')"><i class="fas fa-history me-2"></i> History</div>
    <div class="sidebar-item p-3 d-flex align-items-center" onclick="openLink('library')"><i class="fas fa-folder me-2"></i> Library</div>
    <div class="sidebar-item p-3 d-flex align-items-center" onclick="openLink('settings')"><i class="fas fa-cogs me-2"></i> Settings</div>
  </div>

  <!-- Sidebar Toggle Button -->
  <button class="btn btn-transparent position-fixed top-0 start-0 m-3" onclick="toggleSidebar()">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Login Button -->
  <button class="btn btn-transparent position-fixed top-0 end-0 m-3" onclick="login()">
    <i class="fas fa-user"></i>
  </button>

  <!-- Dark/Light Mode Toggle Button -->
  <button class="btn btn-transparent position-fixed top-0 end-0 m-3 dark-mode-btn" onclick="toggleDarkMode()">
    <i class="fas fa-moon dark-mode-icon"></i>
  </button>

  <!-- Main Content -->
  <div class="container mt-5" id="main-content">
    <div class="d-flex justify-content-center mb-3">
      <div class="btn-group" role="group" aria-label="Basic example">
        <button class="btn btn-outline-light" id="googleBtn"><i class="fab fa-google"></i></button>
        <button class="btn btn-outline-light" id="youtubeBtn"><i class="fab fa-youtube"></i></button>
        <button class="btn btn-outline-light" id="facebookBtn"><i class="fab fa-facebook"></i></button>
        <button class="btn btn-outline-light" id="twitterBtn"><i class="fab fa-twitter"></i></button>
      </div>
    </div>

    <!-- Search Box -->
    <div class="d-flex justify-content-center mb-4">
      <input type="text" id="searchBar" class="form-control w-50" placeholder="Search or type URL">
      <button class="btn btn-outline-light ms-2" id="searchBtn"><i class="fas fa-search"></i></button>
      <button class="btn btn-outline-light ms-2" id="voiceSearchBtn"><i class="fas fa-microphone"></i></button>
    </div>

    <!-- Web View Section -->
    <div class="web-view">
      <iframe id="webView" src="about:blank" class="w-100" style="height: 500px; border: none;"></iframe>
    </div>
  </div>

  <!-- Bootstrap 5 and custom script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Initialize elements
    const searchBtn = document.getElementById('searchBtn');
    const voiceSearchBtn = document.getElementById('voiceSearchBtn');
    const searchBar = document.getElementById('searchBar');
    const googleBtn = document.getElementById('googleBtn');
    const youtubeBtn = document.getElementById('youtubeBtn');
    const facebookBtn = document.getElementById('facebookBtn');
    const twitterBtn = document.getElementById('twitterBtn');
    const webView = document.getElementById('webView');
    const sidebar = document.getElementById('sidebar');
    const body = document.body;

    // Sidebar Toggle functionality
    function toggleSidebar() {
      sidebar.style.left = sidebar.style.left === '0px' ? '-250px' : '0px';
    }

    // Dark/Light Mode functionality
    function toggleDarkMode() {
      body.classList.toggle('bg-dark');
      body.classList.toggle('text-white');
      body.classList.toggle('dark-mode');
      body.classList.toggle('light-mode');

      const icon = document.querySelector('.dark-mode-btn i');
      icon.classList.toggle('fa-sun');
      icon.classList.toggle('fa-moon');
    }

    // Login Button functionality
    function login() {
      alert("Login functionality is not yet implemented.");
    }

    // Search Button functionality
    searchBtn.addEventListener('click', () => {
      const query = searchBar.value;
      if (query.includes('http') || query.includes('www')) {
        webView.src = query; // Open entered URL
      } else {
        webView.src = `https://www.google.com/search?q=${query}`; // Search query
      }
    });

    // Voice Search Button functionality
    voiceSearchBtn.addEventListener('click', () => {
      alert("Voice Search feature is not yet implemented.");
    });

    // Bookmark Button functionalities
    googleBtn.addEventListener('click', () => {
      webView.src = 'https://www.google.com';
    });

    youtubeBtn.addEventListener('click', () => {
      webView.src = 'https://www.youtube.com';
    });

    facebookBtn.addEventListener('click', () => {
      webView.src = 'https://www.facebook.com';
    });

    twitterBtn.addEventListener('click', () => {
      webView.src = 'https://www.twitter.com';
    });

    // Search Bar functionality (load URL or search)
    searchBar.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchBar.value;
        if (query.includes('http') || query.includes('www')) {
          webView.src = query; // Open entered URL
        } else {
          webView.src = `https://www.google.com/search?q=${query}`; // Search query
        }
      }
    });
  </script>
</body>
</html>
