<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <!-- Link to Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* Sidebar styling */
    .sidebar {
      position: fixed;
      height: 100%;
      background-color: #343a40;
      color: white;
      width: 250px;
      left: -250px;
      transition: left 0.3s;
      overflow-y: auto;
    }

    .sidebar-item {
      cursor: pointer;
      padding: 10px;
      border-bottom: 1px solid #555;
      color: white; /* Default color in dark mode */
    }

    .sidebar-item:hover {
      background-color: #495057;
    }

    /* Content area */
    #main-content {
      margin-left: 0;
      transition: margin-left 0.3s;
      overflow-x: hidden; /* Prevent horizontal scrolling */
    }

    .sidebar-visible #main-content {
      margin-left: 250px;
    }

    /* For active sidebar item */
    .sidebar-item.active {
      background-color: #495057;
    }

    /* Dark/Light Mode Styling */
    body {
      overflow-x: hidden;
    }

    /* Dark Mode */
    .dark-mode .sidebar-item {
      color: white; /* Sidebar items in dark mode */
    }

    .dark-mode .sidebar-item.active {
      background-color: #495057;
    }

    .dark-mode-btn i {
      color: white; /* Dark mode button icon color */
    }

    .dark-mode .sidebar-item i {
      color: #FF8C00; /* Sidebar icons in dark mode */
    }

    /* Light Mode */
    .light-mode .sidebar-item {
      color: rgb(255, 255, 255); /* Sidebar items in light mode */
    }

    .light-mode .sidebar-item.active {
      background-color: #f8f9fa;
      color: black;
    }

    .light-mode .sidebar-item i {
      color: #fefeff; /* Icons color in light mode */
    }

    .light-mode .dark-mode-btn i {
      color: #000435; /* Dark mode button icon color in light mode */
    }

    .light-mode #searchBtn i, .light-mode #voiceSearchBtn i {
      color: black; /* Icons in light mode */
    }

    .web-view iframe {
      height: 500px;
      border: none;
    }

    /* Icons above the search box */
    #searchBtn i, #voiceSearchBtn i {
      color: #ccc; /* Default color for icons above the search bar */
    }

    /* Icons color in the top button group */
    .btn-group button i {
      color: #fff;
    }

    .dark-mode .btn-group button i {
      color: #FF8C00; /* Icons in the button group in dark mode */
    }

    .light-mode .btn-group button i {
      color: #000000; /* Icons in the button group in light mode */
    }

    .card-title, .card-text{
      color: black;
    }
    

  </style>
</head>
<body class="bg-dark text-white dark-mode">
  <!-- Sidebar -->
  

  <!-- Sidebar Toggle Button -->
  <!-- <button class="btn btn-transparent btn-light position-fixed top-0 start-0 m-3" onclick="toggleSidebar()">
    <i class="fas fa-bars dark-mode-btn"></i>
  </button> -->

  <!-- Dark/Light Mode Toggle Button -->
  <button class="btn btn-transparent btn-outline-light position-fixed top-0 end-0 m-3 dark-mode-btn" onclick="toggleDarkMode()">
    <i class="fas fa-moon dark-mode-btn"></i>
  </button>



  
  

 

  <!-- Main Content id="main-content"-->
   
  <div class="container mt-5" id="main-content" >
    
    <div class="d-flex justify-content-center mb-4">
      <div class="btn-group" role="group" aria-label="Basic example">
        <a class="btn btn-outline-light ms-3" id="twitterBtn" href="/resume/resume_extraction"><i class="bi bi-file-person"></i>Resume</a>

      </div>
    </div>
    <!-- Search Box -->
    <div class="d-flex justify-content-center mb-4">
      <input type="text" id="searchBar" class="form-control w-70" placeholder="Search or type URL">
      <button class="btn btn-outline-light ms-2" id="searchBtn"><i class="fas fa-search"></i></button>
      <button class="btn btn-outline-light ms-2" id="voiceSearchBtn"><i class="fas fa-microphone"></i></button>
    </div>
    <!-- <hr> -->


    

    <!-- Web View Section -->
    <!-- <div class="web-view">
      <iframe id="webView" src="about:blank" class="w-100"></iframe>
    </div> -->
  </div>
  

  <!-- Bootstrap 5 and custom script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Initialize elements
    const searchBtn = document.getElementById('searchBtn');
    const voiceSearchBtn = document.getElementById('voiceSearchBtn');
    const searchBar = document.getElementById('searchBar');
    const googleBtn = document.getElementById('googleBtn');
    const youtubeBtn = document.getElementById('youtubeBtn');
    const facebookBtn = document.getElementById('facebookBtn');
    const twitterBtn = document.getElementById('twitterBtn');
    const webView = document.getElementById('webView');
    const sidebar = document.getElementById('sidebar');
    const body = document.body;

    // Sidebar Toggle functionality
    function toggleSidebar() {
      const sidebarIsVisible = sidebar.style.left === '0px';
      sidebar.style.left = sidebarIsVisible ? '-250px' : '0px';
      document.body.classList.toggle('sidebar-visible');
      

    }

    // Dark/Light Mode functionality
    function toggleDarkMode() {
      body.classList.toggle('bg-dark');
      body.classList.toggle('text-white');
      body.classList.toggle('dark-mode');
      body.classList.toggle('light-mode');

      const icon = document.querySelector('.dark-mode-btn i');
      icon.classList.toggle('fa-sun');
      icon.classList.toggle('fa-moon');
    }

    // Page navigation functionality
    function openLink(page) {
      let content = '';
      switch (page) {
        case 'home':
          content = ` 
            <div class="d-flex justify-content-center mb-4">
            <div class="btn-group" role="group" aria-label="Basic example">
              <a class="btn btn-outline-light ms-3" id="twitterBtn" href="/resume/resume_extraction"><i class="far fa-address-card"></i> Resume</a>
            </div>
          </div>
          <!-- Search Box -->
          <div class="d-flex justify-content-center mb-4">
            <input type="text" id="searchBar" class="form-control w-50" placeholder="Search or type URL">
            <button class="btn btn-outline-light ms-2" id="searchBtn"><i class="fas fa-search"></i></button>
            <button class="btn btn-outline-light ms-2" id="voiceSearchBtn"><i class="fas fa-microphone"></i></button>
          </div>
          `;
          break;
        case 'trending':
          content = '<h1>Trending Content</h1>';
          break;
        case 'subscriptions':
          content = '<h1>Your Subscriptions</h1>';
          break;
        case 'history':
          content = '<h1>History</h1>';
          break;
        case 'library':
          content = '<h1>Your Library</h1>';
          break;
        case 'settings':
          content = '<h1>Settings</h1>';
          break;
       

      }
      document.getElementById('main-content').innerHTML = content;
      attachSearchFunctionality();

      // Set active state for sidebar item
      const sidebarItems = document.querySelectorAll('.sidebar-item');
      sidebarItems.forEach(item => {
        item.classList.remove('active');
        if (item.textContent.trim().toLowerCase() === page) {
          item.classList.add('active');
        }
      });
    }

    // Attach search functionality to buttons
    function attachSearchFunctionality() {
      searchBtn.addEventListener('click', () => {
        const query = searchBar.value;
        if (query.includes('http') || query.includes('www')) {
          webView.src = query; // Open entered URL
        } else {
          webView.src = `https://www.google.com/search?q=${query}`; // Search query
        }
      });

      voiceSearchBtn.addEventListener('click', () => {
        alert("Voice Search feature is not yet implemented.");
      });

      searchBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const query = searchBar.value;
          if (query.includes('http') || query.includes('www')) {
            webView.src = query; // Open entered URL
          } else {
            webView.src = `https://www.google.com/search?q=${query}`; // Search query
          }
        }
      });
    }

    // Initialize Home page by default
    openLink('home');
  </script>
</body>
</html>
