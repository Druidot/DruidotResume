{% extends './frontend/base.html' %}
{% block body %}

<div class="container mt-5" id="company-container">
    <!-- Content will be loaded dynamically -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function fetchData() {
        try {
            const response = await fetch('http://127.0.0.1:5000/admin/get_all_records/{{company_id}}');
            const data = await response.json();
            if (data && data.companies) {
                data.companies.forEach(company => renderCompany(company));
            } else {
                console.error('Invalid data structure:', data);
            }
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }

    function renderCompany(data) {
        const container = document.getElementById('company-container');

        const companyCard = `
            <div class="card mb-4 shadow-lg border-0 rounded-4">
                <div class="card-body">
                    <h2 class="card-title text-primary">${data.company_name}</h2>
                    <p class="card-text mb-1"><strong>Address:</strong> ${data.company_address}</p>
                    <p class="card-text mb-1"><strong>Email:</strong> ${data.company_email}</p>
                    <p class="card-text mb-4"><strong>Phone:</strong> ${data.company_phone}</p>
                </div>
            </div>
            <h4 class="text-secondary mb-4">Branches</h4>
        `;

        container.innerHTML += companyCard;

        data.branches.forEach(branch => {
            const branchCard = document.createElement('div');
            branchCard.className = 'card mb-4 shadow-sm border-0 rounded-4';

            branchCard.innerHTML = `
                <div class="card-body">
                    <h5 class="card-title">${branch.branch_name} - ${branch.city.city_name}, ${branch.city.country.country_name}</h5>
                    <h6 class="text-muted">Departments:</h6>
                </div>
            `;

            branch.departments.forEach(dept => {
                const deptContainer = document.createElement('div');
                deptContainer.className = 'ps-3 mb-3';

                deptContainer.innerHTML = `<h6><strong>${dept.department_name} Department</strong></h6>`;

                dept.projects.forEach(proj => {
                    const projectCard = document.createElement('div');
                    projectCard.className = 'card mb-3 shadow-sm border rounded-3';

                    // <div class="card-body">
                    //         <h6 class="card-title">Project: ${proj.project_name}</h6>
                    //         <p class="card-text">Manager: ${proj.managers.map(mgr => mgr.manager_name).join(', ')}</p>


                            
                    //         <label class="form-label">Add Job Description:</label>
                    //         <textarea class="form-control mb-2" rows="2" placeholder="Enter job description..." id="project_manager_jd_${proj.project_id}"></textarea>
                    //         <button class="btn btn-outline-primary" onclick="shareLink('${proj.project_name}')">Share Link</button>
                    //         <button class="btn btn-outline-primary" onclick="createJobDescription('${proj.project_id}')">Submit</button>

                    //     </div>

                    projectCard.innerHTML = `
                      


                        <div class="card-body">
                            <h6 class="card-title">Project: ${proj.project_name}</h6>
                            <p class="card-text">Manager: ${proj.managers.map(mgr => mgr.manager_name).join(', ')}</p>

                             <!-- Job Descriptions Accordion -->
                            <div class="accordion mt-3" id="jobDescriptionAccordion">
                                ${proj.job_descriptions.map((job, index) => `
                                    <div class="accordion-item">
                                        <h2 class="accordion-header" id="heading${index}">
                                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${index}" aria-expanded="false" aria-controls="collapse${index}">
                                                Job Description ${index + 1} - ${job.remarks}
                                            </button>
                                        </h2>
                                        <div id="collapse${index}" class="accordion-collapse collapse" aria-labelledby="heading${index}" data-bs-parent="#jobDescriptionAccordion">
                                            <div class="accordion-body">
                                                <p><strong>Created By:</strong> ${job.created_by}</p>
                                                <p><strong>Updated By:</strong> ${job.updated_by}</p>
                                                <p>${job.job_description.replace(/\n/g, '<br>')}</p>
                                            </div>
                                            <div class="accordion-body">
                                                <a class="btn btn-outline-dark" href="/resume/resume_extraction/${job.job_description_id}" type="button">Process Resume</a>
                                            </div>

                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <br>
                            <br>


                            <!-- Add Job Description Form -->
                            <label class="form-label">Add Job Description:</label>
                            <textarea class="form-control mb-2" rows="2" placeholder="Enter job description..." id="project_manager_jd_${proj.project_id}"></textarea>
                            <button class="btn btn-outline-primary" onclick="shareLink('${proj.project_name}')">Share Link</button>
                            <button class="btn btn-outline-primary" onclick="createJobDescription('${proj.project_id}')">Submit</button>

                           
                        </div>
                    `;

                    deptContainer.appendChild(projectCard);
                });

                branchCard.querySelector('.card-body').appendChild(deptContainer);
            });

            container.appendChild(branchCard);
        });
    }

    function shareLink(projectName) {
        const link = `${window.location.href}?project=${encodeURIComponent(projectName)}`;
        navigator.clipboard.writeText(link).then(() => {
            alert(`Link for project "${projectName}" copied to clipboard!`);
        }).catch(err => console.error('Error copying link:', err));
    }

    fetchData();



async function createJobDescription(project_id, manager_id) {
        const
    jobData = {
            manager_id: 1,
            project_id: project_id,
            job_description: document.getElementById(`project_manager_jd_${project_id}`).value,
            created_by: 'admin',
            updated_by: 'admin',
            remarks: 'Urgent hiring'
        }
        try {
            const response = await fetch('/admin/add/job-description', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jobData)
            });

            const result = await response.json();

            if (response.ok) {
                console.log('Job description created:', result);
            } else {
                console.error('Error creating job description:', result.error);
            }
        } catch (error) {
            console.error('Request failed:', error);
        }
}
</script>

{% endblock body %}
