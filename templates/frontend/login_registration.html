<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="light-mode d-flex flex-column justify-content-center align-items-center vh-100 bg-light text-dark">

  <!-- Dark/Light Mode Toggle -->
  <div class="position-absolute top-0 end-0 m-3">
    <button id="toggleMode" class="btn btn-outline-dark">Dark Mode</button>
  </div>

  <!-- Flash Messages -->
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} mt-3 text-center">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <!-- Login Form -->
  <div class="card p-4 shadow mt-4 bg-light text-dark" id="formContainer">
    <h2 class="text-center">Login</h2>
    <form id="loginForm" action="/auth/login" method="post">
      <input type="text" class="form-control my-2" placeholder="Username" required name="email">
      <input type="password" class="form-control my-2" placeholder="Password" required name="password">
      <button type="submit" class="btn btn-primary w-100 my-2">Login</button>
    </form>
    <p class="text-center">Don't have an account? <a href="#" onclick="showRegister()">Register here</a></p>
  </div>

  <!-- Registration Form -->
  <div class="card p-4 shadow mt-4 bg-light text-dark" id="registerContainer" style="display: none;">
    <h2 class="text-center">Register</h2>
    <form id="registerForm" action="/auth/register" method="post">
      <input type="text" class="form-control my-2" placeholder="Username" required name="username">
      <input type="email" class="form-control my-2" placeholder="Email" required name="email">
      <input type="password" class="form-control my-2" placeholder="Password" required name="password">
      <button type="submit" class="btn btn-primary w-100 my-2">Register</button>
    </form>
    <p class="text-center">Already have an account? <a href="#" onclick="showLogin()">Login here</a></p>
  </div>

  <script>
    // Dark and Light Mode Toggle
    const toggleMode = document.getElementById('toggleMode');
    const currentMode = localStorage.getItem('mode') || 'light';
    document.body.classList.toggle('bg-dark', currentMode === 'dark');
    document.body.classList.toggle('text-light', currentMode === 'dark');
    document.body.classList.toggle('bg-light', currentMode === 'light');
    document.body.classList.toggle('text-dark', currentMode === 'light');

    document.querySelectorAll('.card').forEach(card => {
      card.classList.toggle('bg-dark', currentMode === 'dark');
      card.classList.toggle('text-light', currentMode === 'dark');
      card.classList.toggle('bg-light', currentMode === 'light');
      card.classList.toggle('text-dark', currentMode === 'light');
    });

    toggleMode.innerText = currentMode === 'dark' ? 'Light Mode' : 'Dark Mode';

    toggleMode.addEventListener('click', function() {
      const mode = document.body.classList.contains('bg-dark') ? 'light' : 'dark';
      document.body.classList.toggle('bg-dark', mode === 'dark');
      document.body.classList.toggle('text-light', mode === 'dark');
      document.body.classList.toggle('bg-light', mode === 'light');
      document.body.classList.toggle('text-dark', mode === 'light');

      document.querySelectorAll('.card').forEach(card => {
        card.classList.toggle('bg-dark', mode === 'dark');
        card.classList.toggle('text-light', mode === 'dark');
        card.classList.toggle('bg-light', mode === 'light');
        card.classList.toggle('text-dark', mode === 'light');
      });

      toggleMode.innerText = mode === 'dark' ? 'Light Mode' : 'Dark Mode';
      localStorage.setItem('mode', mode);
    });

    // Switch between Login and Register forms
    function showRegister() {
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('registerContainer').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('registerContainer').style.display = 'none';
      document.getElementById('formContainer').style.display = 'block';
    }
  </script>

</body>
</html>
