<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register Company/Organization</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h3 class="mb-4">Register Your Organization</h3>
    <form action="/auth/organization/register" method="POST" enctype="multipart/form-data">

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="title" class="form-label">Organization Title</label>
                <input type="text" class="form-control" id="title" name="title" required placeholder="Enter organization title">
            </div>
            <div class="col-md-6">
                <label for="logo" class="form-label">Upload Logo</label>
                <input type="file" class="form-control" id="logo" name="logo" accept="image/*" required placeholder="Upload logo">
            </div>
        </div>
        <div class="row">
            <div class="col-12 text-end">
                <button type="submit" class="btn btn-primary">Register</button>
            </div>
        </div>

    </form>
</div>

</body>
</html>
