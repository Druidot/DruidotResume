<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">User Table</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">

                <table id="myTable"
                    class="table table-bordered table-striped table-hover table-responsive table-sm text-center">
                    <thead class="table-info">
                        <tr>
                            <th width="200px">SR.No</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th width="200px">Created Date</th>
                            <th>Role</th>
                            <th>Is Active</th>
                            <th>Is Verified</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <th scope="row">{{ loop.index }}</th>
                            <td>{{ user.username }}</td>
                            <td>{{ user.email }}</td>
                            <td>{{ user.created_at.strftime('%d-%b-%Y %I:%M:%S %p') }}</td>
                            <td>
                                <select {% if user.is_admin %} disabled {% endif %} onchange="ChangeRole('{{user.id}}')"
                                    id="user_id_{{user.id}}">
                                    <option value="" {% if user.roles=='' %} selected {% endif %}>Please Select Role...
                                    </option>
                                    <option value="admin" {% if user.roles=='admin' %} selected {% endif %}>Admin
                                    </option>
                                    <option value="user" {% if user.roles=='user' %} selected {% endif %}>User</option>
                                    <option value="customer" {% if user.roles=='customer' %} selected {% endif %}>
                                        Customer</option>
                                </select>
                            </td>
                            <td>
                                <input type="checkbox" {% if user.is_active %} checked {% endif %}
                                    class="form-check-input" onchange="MakeActive('{{user.id}}')" {% if user.is_admin %}
                                    disabled {% endif %}>
                            </td>
                            <td>
                                <input type="checkbox" {% if user.is_verified %} checked {% endif %}
                                    class="form-check-input" onchange="Makeverified('{{user.id}}')" {% if user.is_admin
                                    %} disabled {% endif %}>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <button type="button" class="btn btn-info">Save changes</button>
            </div>
        </div>
    </div>
</div>
