<div class="modal fade" id="managerregistration" tabindex="-1" aria-labelledby="managerregistrationLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="managerregistrationLabel">Manager Registration</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
                
                <form action="/admin/add_manager" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Company <span class="required text-danger">*</span>
                            </label>
                            <select class="form-control" id="managerCompany" name="company_id" required>
                                <option value="" disabled selected>Select Company</option>
                                <!-- Company options go here -->
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Manager <span class="required text-danger">*</span>
                            </label>
                            <select class="form-control" id="managerProjectMapUserManager" name="manager_user_id" required>
                                <option value="" disabled selected>Select Manager</option>
                                <!-- Manager options go here -->
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-info">Save changes</button>
                    </div>
                </form>

                
            </div>
        </div>
    </div>
</div>
