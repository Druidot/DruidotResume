<div class="modal fade" id="countryregistration" tabindex="-1" aria-labelledby="countryregistrationLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="countryregistrationLabel">Country Registration</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form action="/admin/add_country" method="POST" id="countryForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Country Name<span class="required">*</span></label>
                            <input type="text" class="form-control" required name="country_name" placeholder="Country Name" id="country_name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Country Code<span class="required">*</span></label>
                            <input type="text" class="form-control" required name="country_code" placeholder="Country Code" id="country_code">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="reset" class="btn btn-dark" id="Reset" onclick="resetCountryForm()">Reset</button>

                        <button type="submit" class="btn btn-info" id="countrysubmitBtn">Save changes</button>
                    </div>
                </form>
                <div class="container mt-4" style="max-height: 60vh; overflow-y: auto;">
                    <table id="countryTables" class="table table-bordered table-hover table-responsive table-sm text-center my-5">
                        <thead class="table-primary">
                            <tr>
                                <th>Country Name</th>
                                <th>Country Code</th>
                                <th colspan="2">Action</th>
    
                            </tr>
                        </thead>
                        <tbody id="countryTablesbody">
                        
                            
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
