<div class="modal fade" id="countryregistration" tabindex="-1" aria-labelledby="countryregistrationLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="countryregistrationLabel">Country Registration</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
                <form action="/admin/add_country" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Country Name<span class="required">*</span></label>
                            <input type="text" class="form-control" required name="country_name" placeholder="Country Name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Country Code<span class="required">*</span></label>
                            <input type="text" class="form-control" required name="country_code" placeholder="Country Code">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-info">Save changes</button>
                    </div>
                </form>
                

            </div>
        </div>
    </div>
</div>
